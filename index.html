<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2d3032">
  <meta name="description" content="Le Créadex de Creature Rumble : toutes les créatures du jeu, leurs types, leurs attaques et leur modèle 3D.">
  <title>Créadex — Creature Rumble</title>
  <link rel="icon" href="assets/icons/shiny.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@700;900&display=swap" rel="stylesheet">
  <style>
    /* Loading screen: inline so it paints before the fonts, the stylesheet and the data. */
    .loader { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: max(18px, env(safe-area-inset-top)) 18px max(26px, env(safe-area-inset-bottom)); background: #9cc7e6 center / cover no-repeat;
      font: 900 18px "Source Sans 3", system-ui, sans-serif; color: #fff; transition: opacity .45s ease, visibility .45s; }
    .loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader::before { content: ""; position: absolute; inset: auto 0 0 0; height: 46%; background: linear-gradient(180deg, transparent, rgba(16, 22, 30, .72)); }
    .loader > * { position: relative; }
    .loader-logo { width: min(440px, 72vw); height: auto; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .3)); animation: loader-bob 2.4s ease-in-out infinite; }
    .loader-foot { width: min(560px, 100%); display: grid; gap: 10px; justify-items: center; }
    .loader .ol { color: #fff; -webkit-text-stroke: .15em #161616; paint-order: stroke fill; }
    .loader-label { font-size: clamp(20px, 3.4vw, 28px); }
    .loader-bar { width: 100%; height: 22px; border-radius: 99px; background: #3a3a3a; border: 3px solid #161616; overflow: hidden; }
    .loader-bar i { display: block; height: 100%; width: 4%; border-radius: 99px; background: linear-gradient(180deg, #fbe3a0, #f7cc62 55%, #e0a83a); transition: width .25s ease; }
    .loader-tip { font-size: clamp(14px, 2.2vw, 17px); text-align: center; min-height: 1.3em; }
    /* Wide screens: the logo in the top left corner, the art's subject (balloon, Clover, village) stays clear. */
    @media (min-aspect-ratio: 5/4) { .loader { align-items: flex-start; } .loader-logo { width: min(340px, 30vw); } .loader-foot { align-self: center; } }
    @keyframes loader-bob { 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .loader-logo { animation: none; } .loader { transition: none; } }
  </style>
  <link rel="stylesheet" href="styles.css?v=20261109b">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div class="loader" id="loader" role="status" aria-live="polite">
    <img class="loader-logo" src="assets/icons/logo.webp" alt="Creature Rumble">
    <div class="loader-foot">
      <div class="loader-label ol" id="loader-label">Loading the Créadex…</div>
      <div class="loader-bar" aria-hidden="true"><i id="loader-fill"></i></div>
      <div class="loader-tip ol" id="loader-tip"></div>
    </div>
  </div>
  <script>
    // Before anything else loads: one of the game's three loading screens, in the reader's language.
    (function () {
      var art = ['balloon', 'clover', 'village'][Math.floor(Math.random() * 3)];
      document.getElementById('loader').style.backgroundImage = 'url(assets/icons/loading_' + art + '.webp)';
      var fr = false; try { fr = localStorage.getItem('creadex-language') === 'fr'; } catch (e) {}
      if (fr) document.getElementById('loader-label').textContent = 'Chargement du Créadex…';
    })();
  </script>
  <div class="world" aria-hidden="true"></div>

  <div class="page" id="top">
    <header class="page-head">
      <div class="title-tab"><img class="title-glyph" src="assets/ui/glyph_dex.png" alt=""><h1 class="ol">Créadex</h1></div>
      <div class="head-meta">
        <span class="ol head-count" id="head-count">—</span>
        <div class="lang" role="group" aria-label="Langue / Language">
          <button type="button" class="btn btn-secondary btn-small" data-lang="fr"><span class="ol">FR</span></button>
          <button type="button" class="btn btn-secondary btn-small" data-lang="en"><span class="ol">EN</span></button>
        </div>
      </div>
      <img class="logo" src="assets/icons/logo.webp" alt="Creature Rumble">
    </header>

    <section class="panel-dark toolbar">
      <div class="toolbar-row">
        <label class="search"><img src="assets/ui/glyph_target.png" alt=""><input id="search" type="search" autocomplete="off" data-i18n-placeholder="search"><kbd>/</kbd></label>
        <button type="button" class="btn btn-secondary" id="sort"><span class="ol" id="sort-label">N° ↑</span></button>
        <button type="button" class="btn btn-secondary" id="reset"><span class="ol" data-i18n="reset">Effacer</span></button>
        <button type="button" class="btn btn-secondary filters-btn" id="filters-btn" aria-expanded="false" aria-controls="more-filters"><span class="ol" data-i18n="filters">Filtres</span><b class="filters-dot" id="filters-dot" hidden></b></button>
      </div>
      <div class="toolbar-row">
        <span class="label-yellow ol" data-i18n="type">Type</span>
        <div class="type-row" id="type-row" role="group"></div>
      </div>
      <div class="toolbar-row more-filters" id="more-filters">
        <span class="label-yellow ol" data-i18n="rarity">Rareté</span>
        <div class="pill-row" id="rarity-row" role="group"></div>
        <span class="label-yellow ol" data-i18n="show">Voir</span>
        <div class="pill-row" id="flag-row" role="group"></div>
      </div>
    </section>

    <div class="cat-head"><span class="cat-tab ol" id="list-title">Créatures</span><span class="ol cat-count" id="list-count"></span></div>
    <section class="grid-band" aria-live="polite">
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden><b class="ol" data-i18n="none">Aucune créature trouvée</b><button type="button" class="btn btn-gold" id="empty-reset"><span class="ol" data-i18n="reset">Effacer</span></button></div>
    </section>
    <footer class="foot"><span data-i18n="foot">Données du jeu : docs/creadex/creadex.csv de creatures-rumble.</span></footer>
  </div>

  <div class="detail" id="detail" hidden role="dialog" aria-modal="true" aria-labelledby="detail-name">
    <div class="detail-back" id="detail-back" aria-hidden="true"></div>
    <div class="detail-page">
      <div class="detail-head">
        <div class="title-tab"><img class="title-glyph" src="assets/ui/glyph_dex.png" alt=""><span class="ol" id="detail-tab">Créadex</span></div>
        <div class="detail-nav">
          <button type="button" class="square" id="prev" aria-label="Précédente"><img src="assets/ui/glyph_arrow.png" alt="" style="transform:scaleX(-1)"></button>
          <button type="button" class="square" id="next" aria-label="Suivante"><img src="assets/ui/glyph_arrow.png" alt=""></button>
        </div>
        <button type="button" class="close" id="close" aria-label="Fermer"></button>
      </div>
      <div class="detail-body">
        <div class="stage-col">
          <div class="stage" id="stage"></div>
          <div class="stage-actions" id="stage-actions"></div>
          <div class="creature-name ol" id="detail-name"></div>
          <div class="name-row" id="name-row"></div>
        </div>
        <div class="side-col" id="side-col"></div>
        <aside class="panel-dark info" id="info"></aside>
      </div>
    </div>
  </div>

  <script type="module" src="app.js?v=20261109b"></script>
</body>
</html>
